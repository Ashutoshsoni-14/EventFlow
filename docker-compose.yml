services:

  # =========================
  # INFRASTRUCTURE
  # =========================

  mongodb:
    image: mongo:7
    container_name: eventflow-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: eventflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: eventflow-rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_ERLANG_COOKIE: "EVENTFLOW_RABBITMQ_SECRET_COOKIE"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # =========================
  # AUTH SERVICE
  # =========================

  auth-service:
    build: ./services/auth-service
    image: eventflow-auth-service
    container_name: eventflow-auth-service
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      MONGO_URI: mongodb://mongodb:27017/eventflow_auth
      JWT_SECRET: eventflow_secret
      JWT_EXPIRES_IN: 1d
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  # =========================
  # EVENT SERVICE
  # =========================

  event-service:
    build: ./services/event-service
    image: eventflow-event-service
    container_name: eventflow-event-service
    ports:
      - "5002:5002"
    environment:
      PORT: 5002
      MONGO_URI: mongodb://mongodb:27017/eventflow_event
      JWT_SECRET: eventflow_secret
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  # =========================
  # SEAT SERVICE
  # =========================

  seat-service:
    build: ./services/seat-service
    image: eventflow-seat-service
    container_name: eventflow-seat-service
    ports:
      - "5003:5003"
    environment:
      PORT: 5003
      MONGO_URI: mongodb://mongodb:27017/eventflow_seat
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://rabbitmq:5672
      JWT_SECRET: eventflow_secret
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # =========================
  # BOOKING SERVICE
  # =========================

  booking-service:
    build: ./services/booking-service
    image: eventflow-booking-service
    container_name: eventflow-booking-service
    ports:
      - "5004:5004"
    environment:
      PORT: 5004
      MONGO_URI: mongodb://mongodb:27017/eventflow_booking
      JWT_SECRET: eventflow_secret
      SEAT_SERVICE_URL: http://seat-service:5003
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      mongodb:
        condition: service_healthy
      seat-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # =========================
  # PAYMENT SERVICE
  # =========================

  payment-service:
    build: ./services/payment-service
    image: eventflow-payment-service
    container_name: eventflow-payment-service
    ports:
      - "5005:5005"
    environment:
      PORT: 5005
      MONGO_URI: mongodb://mongodb:27017/eventflow_payment
      JWT_SECRET: eventflow_secret
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # =========================
  # NOTIFICATION SERVICE
  # =========================

  notification-service:
    build: ./services/notification-service
    image: eventflow-notification-service
    container_name: eventflow-notification-service
    ports:
      - "5006:5006"
    environment:
      PORT: 5006
      JWT_SECRET: eventflow_secret
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # =========================
  # API GATEWAY
  # =========================

  api-gateway:
    build: ./api-gateway
    image: eventflow-api-gateway
    container_name: eventflow-api-gateway
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      AUTH_SERVICE_URL: http://auth-service:5001
      EVENT_SERVICE_URL: http://event-service:5002
      SEAT_SERVICE_URL: http://seat-service:5003
      BOOKING_SERVICE_URL: http://booking-service:5004
      PAYMENT_SERVICE_URL: http://payment-service:5005
      NOTIFICATION_SERVICE_URL: http://notification-service:5006
    depends_on:
      - auth-service
      - event-service
      - seat-service
      - booking-service
      - payment-service
      - notification-service
    restart: unless-stopped

  # =========================
  # NGINX
  # =========================

  nginx:
    image: nginx:alpine
    container_name: eventflow-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
    restart: unless-stopped

volumes:
  mongodb_data:
  rabbitmq_data: